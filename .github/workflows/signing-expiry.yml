name: Signing expiry checks
on:
  pull_request:
    paths:
      - 'Cassette/**'
      - 'CassetteTests/SigningExpiryTests.swift'
      - 'scripts/check-signing.sh'
      - '.github/workflows/signing-expiry.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  signing-and-ios-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test parser, countdown and notification scheduling
        run: bash scripts/check-signing.sh
      - name: Compile iOS Debug with previews, without signing
        run: |
          set -o pipefail
          xcodebuild -project Cassette.xcodeproj -scheme Cassette \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CassetteSigningBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/cassette-signing-build.log"
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassette-signing-build-log
          path: ${{ runner.temp }}/cassette-signing-build.log
